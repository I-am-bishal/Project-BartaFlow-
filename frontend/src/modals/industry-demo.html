<!-- DEMO MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="demo-modal">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div class="modal-bot-header">
      <div class="modal-bot-icon" id="m-icon">🏠</div>
      <div>
        <div class="modal-bot-name" id="m-name">PropBot Pro</div>
        <div class="modal-bot-industry" id="m-industry">REAL ESTATE · INTERACTIVE DEMO</div>
      </div>
    </div>
    <div class="demo-chat" id="demo-chat"></div>
    <div class="demo-input-row">
      <input class="demo-input" id="demo-input" placeholder="Type your message..."
        onkeydown="if(event.key==='Enter')sendDemoMsg()">
      <button class="demo-send-btn" onclick="sendDemoMsg()">Send →</button>
    </div>
  </div>
</div>
